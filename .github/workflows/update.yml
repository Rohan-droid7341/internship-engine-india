name: Update internships

on:
  schedule:
    - cron: "0 * * * *"    # every hour (UTC) — catch new drops fast
  push:
    branches: [main]        # prod runs only on main
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed so the bot can commit the refreshed data

concurrency:
  group: update-internships
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # ── Safety guard: scheduled runs stay on main only.
    # On test-fetch we only allow manual workflow_dispatch triggers.
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Install Playwright browser for Scrapling's StealthyFetcher (Naukri etc.)
          python -m playwright install chromium --with-deps

      # ── Production run (main branch): full pipeline with all integrations ──
      - name: Run the engine (full)
        if: github.ref == 'refs/heads/main'
        env:
          # Optional: WORKDAY_PROXY lets the cloud runner reach Workday tenants
          # that block datacenter IPs. Unset = Workday runs direct.
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
          # Optional: set these repo secrets to mirror each run into Postgres.
          # Unset = the engine still runs and exports README/CSV as normal.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional: Discord channel webhook — posts each run's new roles.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: Brevo transactional key + verified sender — arms the
          # daily email digest to the subscriber list (see mailer.py).
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # Twilio WhatsApp secrets — triggers WhatsApp alerts for new roles.
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          # Gemini API key for compensation intelligence & search grounding
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: python run.py update

      # ── Test run (test-fetch branch): fetch-only, zero side-effects ──
      # No README, no website, no mailing, no Discord, no WhatsApp, no Supabase.
      - name: Run the engine (fetch-only, test branch)
        if: github.ref != 'refs/heads/main'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: python run.py fetch-only

      # ── Commit only on main (test branch never writes back) ──
      - name: Commit & push if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "Rohangarg"
          git config user.email "garg20005rohan@gmail.com"
          git add README.md data/*.json data/*.csv data/*.jsonl \
                  docs/index.html docs/feed.xml docs/unsubscribe.html \
                  docs/radar.ics docs/trends-light.svg docs/trends-dark.svg \
                  docs/api/*.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update internships ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Hourly cadence can overlap the daily discovery push; rebase onto
            # whatever landed (different files, so this auto-merges) and retry.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race, retrying ($attempt)…"; sleep 5
            done
          fi
