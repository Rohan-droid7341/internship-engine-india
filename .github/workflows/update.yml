name: Update internships

on:
  schedule:
    - cron: "0 */3 * * *"   # runs every 3 hours (UTC)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed so the bot can commit the refreshed data

concurrency:
  group: update-internships
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Install Playwright browser for Scrapling's StealthyFetcher (Naukri etc.)
          python -m playwright install chromium --with-deps

      - name: Run the engine
        env:
          # Optional: WORKDAY_PROXY lets the cloud runner reach Workday tenants
          # that block datacenter IPs. Unset = Workday runs direct.
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
          # Optional: set these repo secrets to mirror each run into Postgres.
          # Unset = the engine still runs and exports README/CSV as normal.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional: Discord channel webhook — posts each run's new roles.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: Brevo transactional key + verified sender — arms the
          # daily email digest to the subscriber list (see mailer.py).
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          # Twilio WhatsApp secrets — triggers WhatsApp alerts for new roles.
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          # Gemini API key for compensation intelligence & search grounding
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py update

      - name: Commit & push if changed
        run: |
          git config user.name  "Rohangarg"
          git config user.email "garg20005rohan@gmail.com"
          git add README.md data/*.json data/*.jsonl \
                  docs/feed.xml docs/radar.ics \
                  docs/trends-light.svg docs/trends-dark.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update internships ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # 3-hourly cadence can overlap the daily discovery push; rebase onto
            # whatever landed (different files, so this auto-merges) and retry.
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                pushed=true
                break
              fi
              echo "push race, retrying ($attempt)…"; sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "Failed to push after 3 attempts"
              exit 1
            fi
          fi
