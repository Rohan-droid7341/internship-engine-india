<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Internship Engine India{% endblock %}</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --orange: #d29922; --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 15px/1.6 -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Nav */
  nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 24px; position: sticky; top: 0; z-index: 10; }
  nav .brand { font-weight: 700; font-size: 17px; color: var(--text); }
  nav a.link { color: var(--muted); font-size: 14px; }
  nav a.link:hover, nav a.link.active { color: var(--text); }

  /* Layout */
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  /* Cards row */
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; min-width: 140px; flex: 1; }
  .card .num { font-size: 24px; font-weight: 700; color: var(--accent); }
  .card .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 49px; background: var(--bg); }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: var(--surface); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); margin: 1px 2px; }
  .tag.green { border-color: var(--green); color: var(--green); }
  .tag.orange { border-color: var(--orange); color: var(--orange); }
  .tag.red { border-color: var(--red); color: var(--red); }
  .badge-open { color: var(--green); }
  .badge-closed { color: var(--red); }

  /* Search */
  .search-bar { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .search-bar input, .search-bar select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 6px; font-size: 14px; }
  .search-bar input { flex: 1; min-width: 200px; }
  .search-bar select { min-width: 140px; }

  /* Footer */
  footer { border-top: 1px solid var(--border); padding: 20px 24px; color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; }

  /* Responsive */
  @media (max-width: 768px) {
    .cards { flex-direction: column; }
    table { font-size: 13px; }
    thead th, tbody td { padding: 8px 6px; }
    .hide-mobile { display: none; }
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <span class="brand">🇮🇳 Internship Engine</span>
    <a href="/" class="link {% if active == 'jobs' %}active{% endif %}">Jobs</a>
    <a href="/stats" class="link {% if active == 'stats' %}active{% endif %}">Stats</a>
    <a href="/companies" class="link {% if active == 'companies' %}active{% endif %}">Companies</a>
    <a href="/api/jobs" class="link">API</a>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer>
    Internship Engine India · Data refreshed every hour by
    <a href="https://github.com/Rohan-droid7341/internship-engine-india">GitHub Actions</a>
  </footer>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
