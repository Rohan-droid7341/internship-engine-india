<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Internship Engine India{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090d16;
    --surface: #0f1523;
    --surface-hover: #161e31;
    --border: #1e293b;
    --border-hover: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --accent: #38bdf8;
    --accent-dim: rgba(56, 189, 248, 0.12);
    --green: #22c55e;
    --green-dim: rgba(34, 197, 94, 0.12);
    --amber: #f59e0b;
    --amber-dim: rgba(245, 158, 11, 0.12);
    --red: #ef4444;
    --red-dim: rgba(239, 68, 68, 0.12);
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; transition: color 0.15s ease; }
  a:hover { text-decoration: underline; color: #7dd3fc; }

  /* Navbar */
  header {
    background: rgba(15, 21, 35, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.2px;
  }
  .brand:hover { text-decoration: none; }
  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 500;
    color: var(--green);
    background: var(--green-dim);
    border: 1px solid rgba(34, 197, 94, 0.25);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .pulse-dot {
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--green);
  }
  nav {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-link {
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: var(--radius);
    transition: all 0.15s ease;
  }
  .nav-link:hover {
    color: var(--text);
    background: var(--surface-hover);
    text-decoration: none;
  }
  .nav-link.active {
    color: var(--text);
    background: var(--surface-hover);
    border: 1px solid var(--border);
  }

  /* Main Container */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  /* Page Header */
  .page-header {
    margin-bottom: 24px;
  }
  .page-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--text);
    margin-bottom: 6px;
  }
  .page-meta {
    color: var(--text-muted);
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* Stat Summary Bar */
  .stat-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
    flex-wrap: wrap;
    font-size: 13px;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-num {
    font-weight: 700;
    color: var(--text);
    font-size: 14px;
  }
  .stat-lbl {
    color: var(--text-muted);
  }
  .stat-sep {
    color: var(--border);
  }

  /* Filter Toolbar */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap {
    flex: 1;
    min-width: 260px;
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
    width: 16px;
    height: 16px;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13.5px;
    padding: 9px 12px 9px 36px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .search-input:focus {
    border-color: var(--accent);
  }
  .select-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13.5px;
    padding: 9px 14px;
    border-radius: var(--radius);
    outline: none;
    cursor: pointer;
    min-width: 140px;
    transition: border-color 0.15s ease;
  }
  .select-input:focus {
    border-color: var(--accent);
  }
  .count-badge {
    font-size: 12.5px;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: var(--radius);
    white-space: nowrap;
  }

  /* Table Card */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-responsive {
    width: 100%;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    text-align: left;
  }
  thead th {
    background: #0d121c;
    color: var(--text-muted);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.12s ease;
  }
  tbody tr:last-child {
    border-bottom: none;
  }
  tbody tr:hover {
    background: var(--surface-hover);
  }
  tbody td {
    padding: 14px 16px;
    vertical-align: middle;
  }

  /* Badges & Chips */
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .badge-summer {
    background: var(--green-dim);
    color: #4ade80;
    border: 1px solid rgba(74, 222, 128, 0.25);
  }
  .badge-fall {
    background: var(--amber-dim);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.25);
  }
  .badge-gray {
    background: rgba(148, 163, 184, 0.1);
    color: var(--text-muted);
    border: 1px solid rgba(148, 163, 184, 0.2);
  }
  .badge-stipend {
    background: rgba(56, 189, 248, 0.1);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.25);
    font-weight: 600;
    font-family: monospace;
    font-size: 12px;
  }
  .skill-pill {
    display: inline-block;
    background: rgba(255, 255, 255, 0.05);
    color: #cbd5e1;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    margin: 1px;
  }
  .status-open {
    color: var(--green);
    font-weight: 500;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .status-closed {
    color: var(--red);
    font-weight: 500;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* Pagination Bar */
  .pagination-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
    background: var(--surface);
  }
  .page-btns {
    display: flex;
    gap: 6px;
  }
  .page-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .page-btn:hover:not(:disabled) {
    background: var(--surface-hover);
    border-color: var(--border-hover);
  }
  .page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Newsletter Card */
  .newsletter-card {
    background: linear-gradient(135deg, rgba(15, 21, 35, 0.95), rgba(22, 30, 49, 0.95));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .newsletter-info {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .newsletter-icon {
    font-size: 24px;
    line-height: 1;
  }
  .newsletter-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .newsletter-desc {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 1px;
  }
  .newsletter-form {
    display: flex;
    gap: 8px;
    align-items: center;
    flex: 1;
    max-width: 420px;
    min-width: 280px;
  }
  .newsletter-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .newsletter-input:focus {
    border-color: var(--accent);
  }
  .newsletter-btn {
    background: var(--accent);
    color: #041226;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .newsletter-btn:hover {
    background: #7dd3fc;
  }
  .newsletter-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
  }

  @media (max-width: 768px) {
    .container { padding: 18px 14px 40px; }
    .hide-mobile { display: none; }
    .stat-bar { gap: 10px; font-size: 12px; }
    .toolbar { flex-direction: column; align-items: stretch; }
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <div class="nav-inner">
      <a href="/" class="brand">
        <span>🇮🇳</span>
        <span>Internship Engine</span>
        <span class="brand-badge"><span class="pulse-dot"></span> Live</span>
      </a>
      <nav>
        <a href="/" class="nav-link {% if active == 'jobs' %}active{% endif %}">Jobs</a>
        <a href="/stats" class="nav-link {% if active == 'stats' %}active{% endif %}">Stats</a>
        <a href="/companies" class="nav-link {% if active == 'companies' %}active{% endif %}">Companies</a>
        <a href="/api/jobs" class="nav-link" target="_blank">API</a>
      </nav>
    </div>
  </header>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer>
    Automatically discovered &amp; refreshed hourly via
    <a href="https://github.com/Rohan-droid7341/internship-engine-india" target="_blank" rel="noopener">GitHub Actions</a> ·
    Direct ATS job feeds across India &amp; Remote
  </footer>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
