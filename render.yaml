services:
  - type: web
    name: internship-engine
    runtime: python
    plan: free
    buildCommand: pip install -r web/requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
